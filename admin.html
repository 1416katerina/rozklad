<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін — Розклад занять</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app admin-app">
    <header class="hero admin-hero">
      <div class="brand">
        <div class="logo">🦝</div>
        <div>
          <span class="badge">адміністратор</span>
          <h1>Редагування розкладу</h1>
        </div>
      </div>
      <p class="lead">Ця сторінка призначена для зміни вільного та заброньованого часу.</p>
    </header>

    <section id="loginPanel" class="login-panel">
      <h2>Вхід</h2>
      <p>Увійдіть через вашу пошту адміністратора.</p>
      <label>Email
        <input id="emailInput" type="email" value="1416katerina@gmail.com" autocomplete="username">
      </label>
      <label>Пароль
        <input id="passwordInput" type="password" autocomplete="current-password">
      </label>
      <button id="loginBtn" class="main-btn">Увійти</button>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="admin-toolbar">
        <div>
          <strong id="adminUser">Вхід виконано</strong>
          <div class="small-muted">Клік по часу: вільно → зайнято → — → вільно</div>
        </div>
        <div class="admin-actions">
          <button id="resetBtn" class="soft-btn">Скинути початковий розклад</button>
          <button id="logoutBtn" class="soft-btn">Вийти</button>
        </div>
      </div>

      <div id="saveMessage" class="save-message">Зміни зберігаються автоматично.</div>
      <main id="adminDaysGrid" class="days-grid"></main>
    </section>

    <footer>
      <a href="index.html">← На публічну сторінку</a>
    </footer>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
